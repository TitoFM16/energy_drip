[project]
name = "medical-api"
version = "0.1.0"
description = "FastAPI backend for the medical appointments platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "boto3>=1.35.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Only needed by apps/worker's PDF-generation activity, which depends on
# this package as a library; kept out of the API's default install so the
# request-serving process doesn't carry WeasyPrint's native dependencies.
pdf = ["weasyprint>=62.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_api"]
