[project]
name = "medical-worker"
version = "0.1.0"
description = "Background jobs: outbox consumer, notification workflows, PDF generation"
requires-python = ">=3.12"
dependencies = [
    "medical-api[pdf]",
    "dramatiq[redis]>=1.17.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "structlog>=24.4.0",
]

[tool.uv.sources]
medical-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_worker"]
