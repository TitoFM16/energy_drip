name: medical-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical
      POSTGRES_DB: medical_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medical
      MINIO_ROOT_PASSWORD: medical123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://medical:medical@postgres:5432/medical_platform
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: medical
      S3_SECRET_KEY: medical123
      S3_BUCKET: medical-platform
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175"]'
    volumes:
      - ./apps/api:/workspace/apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://medical:medical@postgres:5432/medical_platform
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: medical
      S3_SECRET_KEY: medical123
      S3_BUCKET: medical-platform
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./apps/worker:/workspace/apps/worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  worker-queue:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["uv", "run", "--project", "/workspace", "--package", "medical-worker", "dramatiq", "medical_worker.tasks"]
    environment:
      DATABASE_URL: postgresql+asyncpg://medical:medical@postgres:5432/medical_platform
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: medical
      S3_SECRET_KEY: medical123
      S3_BUCKET: medical-platform
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./apps/worker:/workspace/apps/worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  staff-web:
    build:
      context: .
      dockerfile: apps/staff-web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/staff-web:/workspace/apps/staff-web
      - staff_web_node_modules:/workspace/apps/staff-web/node_modules
      - ./packages:/workspace/packages
    depends_on:
      - api

  patient-web:
    build:
      context: .
      dockerfile: apps/patient-web/Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/patient-web:/workspace/apps/patient-web
      - patient_web_node_modules:/workspace/apps/patient-web/node_modules
      - ./packages:/workspace/packages
    depends_on:
      - api

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    ports:
      - "5175:5175"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/landing:/workspace/apps/landing
      - landing_node_modules:/workspace/apps/landing/node_modules
      - ./packages:/workspace/packages

volumes:
  postgres_data:
  minio_data:
  staff_web_node_modules:
  patient_web_node_modules:
  landing_node_modules:
