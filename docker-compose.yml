name: medical-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical
      POSTGRES_DB: medical_platform
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d medical_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://medical:medical@postgres:5432/medical_platform
      PRIVATE_STORAGE_PATH: /data/private
      PUBLIC_MEDIA_PATH: /data/media
      PUBLIC_ORGANIZATION_ID: ${PUBLIC_ORGANIZATION_ID:-}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Bogota}
      PATIENT_WEB_BASE_URL: http://localhost:5174
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175"]'
    volumes:
      - ./apps/api:/workspace/apps/api
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  staff-web:
    build:
      context: .
      dockerfile: apps/staff-web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/staff-web:/workspace/apps/staff-web
      - staff_web_node_modules:/workspace/apps/staff-web/node_modules
      - ./packages:/workspace/packages
    depends_on:
      api:
        condition: service_healthy

  patient-web:
    build:
      context: .
      dockerfile: apps/patient-web/Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/patient-web:/workspace/apps/patient-web
      - patient_web_node_modules:/workspace/apps/patient-web/node_modules
      - ./packages:/workspace/packages
    depends_on:
      api:
        condition: service_healthy

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    ports:
      - "5175:5175"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/landing:/workspace/apps/landing
      - landing_node_modules:/workspace/apps/landing/node_modules
      - ./packages:/workspace/packages
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
  staff_web_node_modules:
  patient_web_node_modules:
  landing_node_modules:
