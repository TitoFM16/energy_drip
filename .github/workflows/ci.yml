name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medical
          POSTGRES_PASSWORD: medical
          POSTGRES_DB: medical_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"
      - run: uv sync --all-packages
      - name: Install PDF rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Apply migrations
        working-directory: apps/api
        run: uv run --project ../.. --package medical-api alembic upgrade head
      - name: Check for model/migration drift
        working-directory: apps/api
        # Fails if a model change has no corresponding migration — catches
        # the class of bug this session hit once already (a schema change
        # that autogenerate silently produced an empty migration for
        # because the new module's models weren't imported into
        # core/model_registry.py; that specific case needs the model to be
        # importable at all, which this check can't detect on its own, but
        # every "forgot to generate/commit a migration for a model change"
        # case with an already-registered model is exactly what this catches).
        run: uv run --project ../.. --package medical-api alembic check
      - name: Regenerate OpenAPI schema and check for drift
        working-directory: apps/api
        # Building the schema is pure route/Pydantic-model introspection —
        # no live server or database needed (see the script's docstring).
        # Only the JSON schema step runs here; the TypeScript-generation
        # step (packages/api-client's `generate:types`) runs in the
        # frontend job below, since it needs pnpm/node, not uv/Python.
        run: |
          uv run --project ../.. --package medical-api python scripts/dump_openapi_schema.py
          git diff --exit-code -- ../../packages/api-client/generated/openapi.json
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate TypeScript API types and check for drift
        working-directory: packages/api-client
        # Reads the openapi.json the backend job's step already verified is
        # fresh — this step only needs to confirm the *TypeScript* is in
        # sync with *that* file, not regenerate it from the live API too.
        run: |
          pnpm run generate:types
          git diff --exit-code -- generated/schema.d.ts
      # `test` was missing from this list — frontend unit tests (staff-web's
      # apiFetch, patient-web's form-validation/payload helpers, landing's
      # booking-payload builder) never actually ran in CI before this.
      - run: pnpm turbo lint typecheck test build
      - name: Build production static sites and validate Caddy configuration
        run: docker build -f deploy/Dockerfile.web --build-arg VITE_SITE_URL=https://clinic.example.com -t energy-drip-web:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright's browser
        run: pnpm --filter @medical-platform/e2e exec playwright install --with-deps chromium
      # Every credential docker-compose.yml needs has a safe empty/dev
      # default baked in (${VAR:-} etc.) — no .env file or secrets needed
      # to bring the stack up here, same as any local `docker compose up`.
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Wait for every service to actually be ready
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8000/health/ready; do sleep 3; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5173 >/dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5174 >/dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5175 >/dev/null; do sleep 2; done'
      - name: Run end-to-end tests
        run: pnpm --filter @medical-platform/e2e test:e2e
      - name: Docker compose logs
        if: failure()
        run: docker compose logs --tail 300
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
