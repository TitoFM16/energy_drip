version: 2
updates:
  # apps/api and apps/worker share one uv workspace rooted at the repo root
  # (pyproject.toml's [tool.uv.workspace]) — one entry covers both.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # pnpm workspace root — covers every app under apps/* and packages/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/staff-web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/patient-web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/landing"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
