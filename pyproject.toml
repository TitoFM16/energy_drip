[project]
name = "medical-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ASYNC", # flake8-async
    "S",   # flake8-bandit
    "TID", # flake8-tidy-imports
]
ignore = [
    "S101", # allow assert (used by pytest)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"**/tests/**/*.py" = ["S101", "S105", "S106"]
# Local dev defaults / OAuth2 scheme literal, not real credentials.
"apps/api/src/medical_api/core/config.py" = ["S105"]
"apps/api/src/medical_api/modules/identity/schemas.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["medical_api", "medical_worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# apps/api/tests and apps/worker/tests are both packages named `tests`
# (each has __init__.py). Default import mode inserts rootdirs onto
# sys.path and caches modules by dotted name, so collecting both from the
# repo root collides: whichever is imported first "wins" the `tests` name
# and the second app's test modules 404 under it. importlib mode imports
# each test file directly without that global name collision.
addopts = ["--import-mode=importlib"]
